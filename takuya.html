<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイムカウンター</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    #count { font-size: 5rem; font-weight: bold; margin: 20px 0; }
    button { font-size: 1.5rem; padding: 10px 30px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>みんなで押すボタン</h1>
  <div id="count">0</div>
  <button id="btn" size="small"><img src="picture/takuyaicon.png" alt="拓也の射精"></button>

  <!-- Firebase SDK (v10 modular JS) -->
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
    apiKey: "AIzaSyCPCL19S2L2QWxl73C9X64YtTSywGMZdcY",
    authDomain: "takuyashaseigakudb.firebaseapp.com",
    databaseURL: "https://takuyashaseigakudb-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "takuyashaseigakudb",
    storageBucket: "takuyashaseigakudb.firebasestorage.app",
    messagingSenderId: "755129972234",
    appId: "1:755129972234:web:73296674f94edbd295d1f3",
    measurementId: "G-LC7QKVW9R8"
    };

    // Firebaseの初期化
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const counterRef = ref(db, 'click_count');

    const countEl = document.getElementById('count');
    const btnEl = document.getElementById('btn');

    // 2. サーバーの値が更新されたらリアルタイムで画面に反映
    onValue(counterRef, (snapshot) => {
      const data = snapshot.val();
      countEl.textContent = data !== null ? data : 0;
    });

    // 3. ボタンを押した時の処理（トランザクション処理で連打や同時押しに対応）
    btnEl.addEventListener('click', () => {
      runTransaction(counterRef, (currentValue) => {
        return (currentValue || 0) + 1;
      });
    });
  </script>
</body>
</html>
