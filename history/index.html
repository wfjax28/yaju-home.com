<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>野獣邸.com | 非公式サイト</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Discordサーバー「野獣邸 | 野獣先輩Tag」の非公式サイトです。">
    <link rel="icon" href="../picture/favicon.webp" sizes="any">
    <link rel="canonical" href="https://yaju-home.com/">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Noto+Sans+JP:wght@100..900&family=Potta+One&display=swap" rel="stylesheet"> 

    <link rel="stylesheet" href="../yaju-home-com.css">
    <!--<link rel="stylesheet" href="./history.css">-->
    <script src="../yaju-home-menu.js" defer></script>
    <script src="../yaju-home-com.js" defer></script>
    <script src="./history-timeline.js" defer></script>
</head>
<body>
    <header class="hero-header">
        <a class="header-yajutei" href="../index.html">野獣邸</a>
    </header>
    <!-- グローバルメニューは yaju-home-menu.js で動的生成(単一ソース) -->
    <div id="site-menu-root" data-page="index"></div>
    
    <main id="content" class="main-content">
        <section class="main">
            <h1 class="tl-heading">ホモの歴史</h1>
            <p class="tl-lead">野獣邸の歴史をナメナメ</p>

            <!-- 年代フィルタ（history-timeline.js がボタンを自動生成） -->
            <div class="tl-filter" id="timeline-filter" role="group" aria-label="年代フィルタ"></div>

            <!-- タイムライン本体（中央ライン + 項目は history-timeline.js が描画） -->
            <div class="timeline-wrap">
                <span class="tl-line" aria-hidden="true"></span>
                <span class="tl-progress" aria-hidden="true"></span>
                <ol class="timeline" id="timeline-root"></ol>
            </div>
            
        </section>
    </main>
    <footer class="site-footer">
        <h1 class="site-footer__title">野獣邸 | 野獣先輩Tag</h1>
    </footer>
</body>
</html>
