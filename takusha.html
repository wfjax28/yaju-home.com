<!-- Appwrite SDK (v14+) -->
<script type="module">
import { Client, Databases, ID } from "https://cdn.jsdelivr.net/npm/appwrite@14.0.1/+esm";

const client = new Client()
    .setEndpoint('https://sgp.cloud.appwrite.io/v1')
    .setProject('6a87d78a002c8b5d12eb');

const databases = new Databases(client);
const DATABASE_ID = '6a87e02900253dd1bfc3';
const POLL_COLLECTION_ID = 'takuya-poll';
const LOCAL_VOTED_KEY = 'has_voted_amount';
const LOCAL_AMOUNT_KEY = 'last_voted_amount';

const amountInput = document.getElementById('amount-input');
const voteBtn = document.getElementById('vote-btn');
const resultMsg = document.getElementById('result-msg');
const totalVotesEl = document.getElementById('total-votes');
const totalMoneyEl = document.getElementById('total-money');
const legendEl = document.getElementById('legend');
const svgEl = document.getElementById('pie-chart');

// ---- SHIFT(試験投票)検出 ----
let shiftHeld = false;
document.addEventListener('keydown', (e) => { if (e.key === 'Shift') shiftHeld = true; });
document.addEventListener('keyup',   (e) => { if (e.key === 'Shift') shiftHeld = false; });

// 円グラフ用パレット
const COLORS = ['#9b6b03', '#6b3b0f', '#c94f4f', '#3a8c5a', '#2f7f9f', '#7a4fae', '#d4813e', '#4f9f8f'];

// 円グラフの座標計算
function polarAngle(r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return [100 + r * Math.cos(rad), 100 + r * Math.sin(rad)];
}

function drawPie(entries) {
  const total = entries.reduce((s, e) => s + e.votes, 0);
  let angle = 0;
  const paths = [];

  entries.forEach((e, i) => {
    const sweep = total > 0 ? (e.votes / total) * 360 : 0;
    const endAngle = angle + sweep;
    if (sweep > 0) {
      const p1 = polarAngle(90, angle);
      const p2 = polarAngle(90, endAngle);
      const largeArc = sweep <= 180 ? 0 : 1;
      paths.push(
        '<path d="M 100 100 L ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
        ' A 90 90 0 ' + largeArc + ' 1 ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) +
        ' Z" fill="' + COLORS[i % COLORS.length] + '" stroke="#ffffff" stroke-width="1.5"></path>'
      );
    }
    angle = endAngle;
  });
  svgEl.innerHTML = paths.join('');

  legendEl.innerHTML = entries.map((e, i) => {
    const pct = total > 0 ? ((e.votes / total) * 100).toFixed(1) : '0.0';
    const label = e.isOther ? 'その他' : e.amount.toLocaleString() + '円';
    return '<li><span class="legend-swatch" style="background:' + COLORS[i % COLORS.length] + '"></span>' +
      label + ': ' + e.votes + '票 (' + pct + '%)</li>';
  }).join('') || '<li>まだ投票がありませんスギ</li>';
}

// 全投票データを取得して合計と円グラフを更新
async function renderResult() {
  try {
    const response = await databases.listDocuments(DATABASE_ID, POLL_COLLECTION_ID);
    const docs = response.documents.filter(d => typeof d.price === 'number' && typeof d.votes === 'number');
    let totalVotes = 0, totalMoney = 0;
    const entries = [];
    docs.forEach(d => {
      totalVotes += d.votes;
      totalMoney += d.price * d.votes;
      entries.push({ amount: d.price, votes: d.votes });
    });
    entries.sort((a, b) => b.votes - a.votes || a.amount - b.amount);

    // 得票数の多い上位10件のみ円グラフに表示し、残りは「その他」として最後にまとめる
    const chartEntries = entries.slice(0, 10);
    const rest = entries.slice(10);
    if (rest.length > 0) {
      chartEntries.push({
        amount: null,
        votes: rest.reduce((sum, d) => sum + d.votes, 0),
        isOther: true
      });
    }

    totalVotesEl.textContent = totalVotes.toLocaleString();
    totalMoneyEl.textContent = totalMoney.toLocaleString();
    drawPie(chartEntries);
  } catch (error) {
    console.error('集計取得失敗:', error);
  }
}

// 金額の投票を送信(重複ならvotes+1、無ければ新規作成)
// ドキュメントIDを金額ベースに固定する事で、インデックスなしでも重複判定できる
function isSchemaError(error) {
  const msg = String(
    (error && error.message) || (error && error.response) || (error && error.type) || ''
  );
  return /unknown attribute|invalid document structure|attribute [a-z]+ does not exist/i.test(msg);
}

async function upsertVote(amount) {
  const docId = 'amount_' + amount;
  try {
    // 既存ドキュメントをIDで取得(無ければ404相当で throw される想定)
    let found = false;
    let curVotes = 0;
    try {
      const doc = await databases.getDocument(DATABASE_ID, POLL_COLLECTION_ID, docId);
      found = true;
      curVotes = doc.votes || 0;
    } catch (err) {
      // ドキュメント未存在なら作成へ
    }

    if (found) {
      await databases.updateDocument(DATABASE_ID, POLL_COLLECTION_ID, docId, {
        votes: curVotes + 1
      });
    } else {
      await databases.createDocument(
        DATABASE_ID, POLL_COLLECTION_ID, ID.custom(docId),
        { price: amount, votes: 1 }
      );
    }
    return { ok: true, needsSchema: false };
  } catch (error) {
    console.error('投票送信失敗:', error);
    if (isSchemaError(error)) {
      return { ok: false, needsSchema: true };
    }
    return { ok: false, needsSchema: false };
  }
}

function handleVote() {
  const isTestVote = shiftHeld;

  // 本投票(非SHIFT)かつ投票済みならポップアップで通知して中止
  if (!isTestVote && localStorage.getItem(LOCAL_VOTED_KEY)) {
    alert('あなたは投票済みです。ありがとナス！');
    return;
  }

  const raw = amountInput.value.trim();
  if (!/^\d+$/.test(raw) || parseInt(raw, 10) < 1) {
    alert('自然数(1以上の整数)で入力してくれよな～頼むよ～');
    return;
  }
  const amount = parseInt(raw, 10);

  voteBtn.disabled = true;
  upsertVote(amount).then((res) => {
    if (!res.ok) {
      voteBtn.disabled = false;
      if (res.needsSchema) {
        alert('なんか(エラー)犯されてるよぉ(データベースに属性 price(整数)・votes(整数) が未定義です。データベースのコンソールで作成してください。)');
        console.error('属性未定義: takuya-poll に price(integer), votes(integer) が必要');
      } else {
        alert('投票できなかったゾ！数回試して無理だったら管理者に報告よろしくナス！');
      }
      return;
    }
    if (isTestVote) {
      voteBtn.disabled = false; // 試験投票は連続可能
      resultMsg.textContent = '投票しました(試験投票: SHIFTのためローカル保存はされていません)';
      alert('投票ありがとナス! (!TEST!)');
    } else {
      localStorage.setItem(LOCAL_VOTED_KEY, '1');
      localStorage.setItem(LOCAL_AMOUNT_KEY, String(amount));
      amountInput.value = '';
      amountInput.placeholder = amount.toLocaleString(); // 過去の入力値をプレースホルダに表示
      resultMsg.textContent = '投票ありがとナス! 集計結果を更新しました。';
      alert('投票ありがとナス!');
    }
    renderResult();
  });
}

voteBtn.addEventListener('click', handleVote);
amountInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); handleVote(); }
});

// ページ読込時: 投票済みならプレースホルダに過去の入力値を設定(ボタンは無効化しない)
if (localStorage.getItem(LOCAL_VOTED_KEY)) {
  const last = localStorage.getItem(LOCAL_AMOUNT_KEY);
  if (last) amountInput.placeholder = Number(last).toLocaleString();
}

// 投票済みフラグ(ローカル保存)のリセットボタン処理。
// ※ 本実装時は、この節と #reset-vote-btn ボタン・#reset-vote-btn スタイルを

    localStorage.removeItem(LOCAL_AMOUNT_KEY); // 過去の入力値も削除

    voteBtn.disabled = false;
    resultMsg.textContent = '投票済みフラグをリセットしました(再投票できます)';
    alert('投票済みフラグと入力値をリセットしました');
  }); 
} */
// ===== 【テスト用】ここまで =====

renderResult();
</script>
